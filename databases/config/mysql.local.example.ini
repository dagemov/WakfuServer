[client]
host=127.0.0.1
port=3306
protocol=tcp
default-character-set=utf8mb4

[mysqld]
basedir=C:/xampp/mysql
datadir=C:/WakfuServer/databases/local/mysql-data
port=3306
bind-address=127.0.0.1
skip-name-resolve
character-set-server=utf8mb4
collation-server=utf8mb4_unicode_ci
pid-file=C:/WakfuServer/databases/local/mysql.pid
log-error=C:/WakfuServer/databases/local/mysql-error.log
